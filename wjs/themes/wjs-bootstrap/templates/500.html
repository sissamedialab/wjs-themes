{% load i18n %}

<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="{% translate "A server error has occurred." %}">
    <meta name="keywords" content="error, 500">
    <title>{% translate "Server Error" %}</title>
</head>
<body>
    <div class="error-container">
        <h1>{% translate "Server Error" %}</h1>
        <p>{% translate "A server error has occurred. Please try again later." %}</p>
    </div>
</body>
</html>
