<div class="wjs-showcase__toc">
  <div class="card-content" id="list-example">
    <h2 class="wjs-showcase__toc-title">
      {% translate "Table of Contents" %}
    </h2>
    <div id="js-toc-list" class="wjs-showcase__toc-nav list-group">
    </div>
  </div>
</div>

<script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function () {
    const content = document.getElementById("js-main-article");
    if (!content) {
      return;
    }
    const toc = document.getElementById("js-toc-list");
    const headings = content.querySelectorAll("h2");
    const items = [];
    const usedIds = new Set();

    function slugify(text) {
      const base = text.trim().toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      if (!usedIds.has(base)) {
        usedIds.add(base);
        return base;
      }
      let n = 2;
      while (usedIds.has(`${base}-${n}`)) n++;
      usedIds.add(`${base}-${n}`);
      return `${base}-${n}`;
    }

    headings.forEach((heading) => {
      const id = heading.id || slugify(heading.textContent);
      if (!heading.id) {
        heading.id = id;
      }

      heading.setAttribute('tabindex', '-1');

      const link = document.createElement("a");
      link.className = "wjs-showcase__toc-link";
      link.href = `#${id}`;
      link.textContent = heading.textContent;

      link.addEventListener('click', () => heading.focus({preventScroll: true}));

      toc.appendChild(link);
      items.push({heading, link});
    });

    if (items.length === 0) {
      return;
    }

    function updateVisibility() {
      const contentBottom = content.getBoundingClientRect().bottom;

      items.forEach(({heading, link}, index) => {
        const top = heading.getBoundingClientRect().top;
        const nextHeading = items[index + 1]?.heading;
        const bottom = nextHeading ? nextHeading.getBoundingClientRect().top : contentBottom;
        const active = top < window.innerHeight && bottom > 0;
        link.classList.toggle("active", active);
        if (active) {
          link.setAttribute("aria-current", "location");
        } else {
          link.removeAttribute("aria-current");
        }
      });
    }

    let frameId = null;
    function onScroll() {
      if (frameId !== null) {
        return;
      }
      frameId = requestAnimationFrame(() => {
        frameId = null;
        updateVisibility();
      });
    }

    window.addEventListener("scroll", onScroll, {passive: true});
    window.addEventListener("resize", onScroll);
    window.addEventListener("load", onScroll);
    updateVisibility();
  });
</script>
