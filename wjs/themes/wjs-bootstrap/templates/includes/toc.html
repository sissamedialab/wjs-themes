<div class="wjs-showcase__toc">
  <div class="card-content" id="list-example">
    <h4 class="wjs-showcase__toc-title">
      {% translate "Table of Contents" %}
    </h4>
    <div id="js-toc-list" class="wjs-showcase__toc-nav list-group">
    </div>
  </div>
</div>

{% block js %}
  <script type="text/javascript">
  document.addEventListener("DOMContentLoaded", function() {
    const content = document.getElementById("js-main-article");
    if (!content) {
      return;
    }
    const toc = document.getElementById("js-toc-list");
    const headings = content.querySelectorAll("h2");
    const items = [];
    const usedIds = new Set();

    function slugify(text) {
      const base = text.trim().toLowerCase()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_]+/g, '-')
        .replace(/-+/g, '-')
        .replace(/^-|-$/g, '');
      if (!usedIds.has(base)) {
        usedIds.add(base);
        return base;
      }
      let n = 2;
      while (usedIds.has(`${base}-${n}`)) n++;
      usedIds.add(`${base}-${n}`);
      return `${base}-${n}`;
    }

    headings.forEach((heading) => {
      const id = heading.id || slugify(heading.textContent);
      if (!heading.id) {
        heading.id = id;
      }

      heading.setAttribute('tabindex', '-1');

      const link = document.createElement("a");
      link.className = "wjs-showcase__toc-link";
      link.href = `#${id}`;
      link.textContent = heading.textContent;

      link.addEventListener('click', () => heading.focus({ preventScroll: true }));

      toc.appendChild(link);
      items.push({ heading, link });
    });

    if (items.length === 0) {
      return;
    }

    const visibilityByHeading = new Map(items.map(({ heading }) => [heading, false]));
    const lastTopByHeading = new Map();

    const options = {
      root: null,
      rootMargin: "0px",
      threshold: [0.0, 1.0],
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        visibilityByHeading.set(entry.target, entry.isIntersecting);
        lastTopByHeading.set(entry.target, entry.boundingClientRect.top);
      });

      const anyVisible = [...visibilityByHeading.values()].some(Boolean);

      let lastAbove = null;
      if (!anyVisible) {
        lastAbove = items.findLast(({ heading }) =>
          (lastTopByHeading.get(heading) ?? 0) < 0
        )?.heading;
      }

      items.forEach(({ heading, link }) => {
        const active = anyVisible
          ? visibilityByHeading.get(heading)
          : heading === lastAbove;
        link.classList.toggle("active", active);
      });
    }, options);

    items.forEach(({ heading }) => observer.observe(heading));
  });
</script>
{% endblock js %}
