{% extends "wjs/base/base.html" %}
{% load hooks i18n static %}

{% block page_title %}{{ view.title }}{% endblock page_title %}
{% block title %}{{ view.title }}{% endblock title %}

{% block content %}
  <div class="col-md-12">
    <div class="wjs-showcase__card">
      <div class="wjs-showcase__card-content">
        <ul class="list-group list-group-flush">
          {% for keyword in keywords %}
            <li class="list-group-item">{{ keyword }}</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
{% endblock content %}
