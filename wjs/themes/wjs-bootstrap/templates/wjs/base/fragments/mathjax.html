{% if journal_settings.general.enable_mathjax_abstract %}
  <script>
    window.MathJax = {
      tex: {inlineMath: [['$', '$'], ['\\(', '\\)']]},
      startup: {
        // don't typeset the whole page, only the elements marked with .tex2jax_process
        typeset: false,
        ready: function () {
          MathJax.startup.defaultReady();
          MathJax.startup.promise.then(function () {
            return MathJax.typesetPromise(Array.from(document.querySelectorAll('.tex2jax_process')));
          });
        },
      },
    };
  </script>
  <script src='https://cdn.jsdelivr.net/npm/mathjax@4.1.1/tex-mml-chtml.js' async></script>
{% else %}
  <script>
    MathJax = {
      tex: {inlineMath: [["\\(", "\\)"], ["$", "$"]]},
      output: {displayOverflow: 'linebreak'},
    };
  </script>
  <script src='https://cdn.jsdelivr.net/npm/mathjax@4.1.1/tex-mml-chtml.js' async></script>
{% endif %}
