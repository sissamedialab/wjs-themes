
{% if request.user.is_authenticated %}
  <div class="dropdown">
    <button class="wjs-header__user-btn dropdown-toggle" type="button" id="user-menu" data-bs-toggle="dropdown" aria-expanded="false">
      {% if show_name %}
        {{ request.user.get_full_name }} <span class="fs-4"><i class="bi bi-person-circle"></i></span>
      {% elif view.role %}
        {% translate "Viewing as" %}: {{ view.role_label }}
      {% else %}
        {% translate "Profile" %}
      {% endif %}
    </button>
    {% if PermissionType %}
      {% include "wjs/base/elements/user_menu_dropdown_list.html" %}
    {% endif %}
  </div>
{% else %}
  <a class="wjs-header__user-btn text-decoration-none" href="{% url "core_login" %}" >
    {% translate "Login" %}
    <span class="fs-4"><i class="bi bi-person-circle"></i></span>
  </a>
{% endif %}
