{% load django_bootstrap5 %}

{% if is_in_list %}
  <li class="nav-item">{% endif %}
{% if current %}
  <span class="d-inline-block ps-0 pe-1 py-1 small text-decoration-none text-muted">
      {{ title }}
    </span>
{% else %}
  {% bootstrap_button button_type="link" button_class="btn-link ps-0 pe-1" content=title href=url size="sm" role="link" %}
{% endif %}
{% if is_in_list %}</li>{% endif %}
