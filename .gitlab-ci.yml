default:
  image: python:3.11
  # Runner must be inside Inasset's farm
  tags:
    - inasset

  cache:
    key: cache-default
    paths:
      - .cache

variables:
  PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip

stages:
  - test
  - build
  - deploy

include:
  - project: 'wjs/wjs-profile-project'
    ref: wjs-develop
    file: '.gitlab-ci-pkg-build-and-upload.yml'
  - project: 'wjs/wjs-profile-project'
    ref: wjs-production
    file: '.gitlab-ci-pkg-deploy.yml'
  - project: 'wjs/wjs-profile-project'
    ref: wjs-develop
    file: '.gitlab-ci-pre-commit.yml'


pre-commit:
  # Always run linting, except for tags
  except:
    - tags
  extends:
    - .run-pre-commit


upload-package:
  only:
    - tags
  extends:
    - .upload-package



deploy-to-pre-production:
  extends:
    - .deploy
  environment: pre-production
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_NAME == "wjs-production"
      when: on_success
    - when: manual
  allow_failure: true
  variables:
    SERVER_IP: "$TEST_SERVER_IP"
    SERVER_USER: "$TEST_SERVER_USER"
    DEPLOY_CMD: "deploy-pp-wjs-themes"


deploy-to-test:
  # Deploy the current commit to test instance
  # Warning! Be sure not to disrupt other peoples work 🙂
  extends:
    - .deploy
  environment: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
  when: manual
  allow_failure: true
  variables:
    SERVER_IP: "$TEST_SERVER_IP"
    SERVER_USER: "$TEST_SERVER_USER"
    DEPLOY_CMD: "deploy-test-wjs-themes:${CI_COMMIT_SHA}"


deploy-to-dev:
  extends:
    - .deploy
  environment: dev
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_NAME == "wjs-develop"
      when: on_success
    - when: manual
  allow_failure: true
  variables:
    SERVER_IP: "$TEST_SERVER_IP"
    SERVER_USER: "$TEST_SERVER_USER"
    DEPLOY_CMD: "deploy-dev-wjs-themes:${CI_COMMIT_SHA}"


deploy-to-production:
  extends:
    - .deploy
  environment: production
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: manual
  allow_failure: true
  variables:
    SERVER_IP: "$PROD_SERVER_IP"
    SERVER_USER: "$PROD_SERVER_USER"
    DEPLOY_CMD: "deploy-prod-wjs-themes"
